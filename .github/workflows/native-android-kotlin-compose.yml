name: Build 100% Native Android (Kotlin + Jetpack Compose)

on:
  push:
    branches: [ "main", "develop", "release/*" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-android:
    name: Build Native Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Build Directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
            **/build
            **/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradlew Executable
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          elif [ -f "android/gradlew" ]; then
            cd android && chmod +x gradlew
          fi

      - name: Run Code Analysis & Linting (Ktlint / Android Lint)
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew lintDebug
          elif [ -f "android/gradlew" ]; then
            cd android && ./gradlew lintDebug
          else
            echo "Gradle wrapper not found, skipping lint."
          fi
        continue-on-error: true

      - name: Run Kotlin Unit Tests
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew testDebugUnitTest
          elif [ -f "android/gradlew" ]; then
            cd android && ./gradlew testDebugUnitTest
          else
            echo "Gradle wrapper not found, skipping unit tests."
          fi
        continue-on-error: true

      - name: Build Debug APK (Kotlin + Jetpack Compose)
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug
          elif [ -f "android/gradlew" ]; then
            cd android && ./gradlew assembleDebug
          else
            echo "Building with root wrapper failed or not found."
          fi

      - name: Build Release APK & AAB (Kotlin + Jetpack Compose)
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleRelease
            ./gradlew bundleRelease
          elif [ -f "android/gradlew" ]; then
            cd android && ./gradlew assembleRelease && ./gradlew bundleRelease
          else
            echo "Building with root wrapper failed or not found."
          fi

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/androidTests/
            **/build/reports/lint-results*

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: native-app-debug.apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Unsigned Release APK
        uses: actions/upload-artifact@v4
        with:
          name: native-app-release-unsigned.apk
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Unsigned Release AAB (Android App Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: native-app-release-unsigned.aab
          path: |
            app/build/outputs/bundle/release/app-release-unsigned.aab
            android/app/build/outputs/bundle/release/app-release-unsigned.aab
